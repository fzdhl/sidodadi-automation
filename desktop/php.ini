[PHP]
; Recommended php.ini configuration for Sidodadi Document Generator Portable PHP

extension_dir = "ext"

; Required extensions for Laravel & PHPWord & SQLite
extension=mbstring
extension=fileinfo
extension=gd
extension=openssl
extension=pdo_sqlite
extension=sqlite3
extension=zip
extension=curl

; Memory limit and execution settings
memory_limit = 256M
post_max_size = 64M
upload_max_filesize = 64M
max_execution_time = 120
