[phases.setup]
nixPkgs = ["php82", "php82Extensions.sqlite3", "php82Extensions.pdo", "php82Extensions.pdo_sqlite", "php82Extensions.mbstring", "php82Extensions.xml", "php82Extensions.fileinfo", "php82Extensions.tokenizer", "php82Extensions.ctype", "php82Extensions.bcmath", "php82Extensions.zip", "php82Extensions.gd", "composer", "nodejs_20", "npm-9_x"]

[phases.build]
cmds = [
  "composer install --no-dev --optimize-autoloader",
  "npm install",
  "npm run build",
  "mkdir -p storage/framework/sessions storage/framework/views storage/framework/cache storage/logs",
  "chmod -R 775 storage bootstrap/cache"
]

[phases.deploy]
cmds = [
  "php artisan migrate --force",
  "php artisan config:cache",
  "php artisan route:cache",
  "php artisan view:cache"
]

[start]
cmd = "php artisan serve --host=0.0.0.0 --port=$PORT"
